<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Olorin Printer Settings</title>
    <link rel="stylesheet" type="text/css" href="css/options.css" />
  </head>
  <body>
    <div class="container">
      <div class="top-head">
        <h1>Printer Settings</h1>
        <button class="btn btn-primary" id="refresh">Refresh Printers</button>
      </div>
      <div id="error-banner" class="error-banner hide">
        Companion App not reachable — make sure it is running, then click Refresh Printers.
      </div>
      <form id="printer" method="post">
        <div class="label-group">
          <div class="col printer-col">Printer</div>
          <div class="col">Page Width</div>
          <div class="col">Page Height</div>
          <div class="col">Printer Option</div>
          <div class="col margin-col">
            <div class="margin-wrap mwt">
              <div class="col full-width">Margin</div>
            </div>
            <div class="margin-wrap mwb">
              <div class="col">Top</div>
              <div class="col">Bottom</div>
              <div class="col">Left</div>
              <div class="col">Right</div>
            </div>
          </div>
          <div class="col">Orientation</div>
          <div class="col">Copies</div>
          <div class="col">Duplex</div>
        </div>

        <div class="form-group">
          <div class="input-row">
            <div class="frm-input-wrap">
              <input
                class="col form-control printer-name"
                type="text"
                name="receipt_printer_label"
                value="Receipt Printer"
                disabled
              />
              <input
                class="col form-control page-size"
                type="number"
                step="0.01"
                placeholder="Width (In)"
                name="receipt_printer_width"
                id="receipt_printer_width"
              />
              <input
                class="col form-control page-size"
                type="number"
                step="0.01"
                placeholder="Height (In)"
                name="receipt_printer_height"
                id="receipt_printer_height"
              />
              <select class="col form-control" name="receipt_printer" id="receipt_printer">
                <option value="">Select</option>
              </select>
              <div class="margin-wrap margin-col">
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  name="receipt_printer_margin_top"
                  id="receipt_printer_margin_top"
                />
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  name="receipt_printer_margin_bottom"
                  id="receipt_printer_margin_bottom"
                />
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  name="receipt_printer_margin_left"
                  id="receipt_printer_margin_left"
                />
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  name="receipt_printer_margin_right"
                  id="receipt_printer_margin_right"
                />
              </div>
              <select
                class="col form-control"
                name="receipt_printer_orientation"
                id="receipt_printer_orientation"
              >
                <option value="">Select</option>
                <option value="Portrait">Portrait</option>
                <option value="Landscape">Landscape</option>
                <option value="Automatic">Automatic</option>
              </select>
              <input
                class="col form-control page-size"
                type="number"
                min="1"
                step="1"
                placeholder="1"
                name="receipt_printer_copies"
                id="receipt_printer_copies"
              />
              <select
                class="col form-control"
                name="receipt_printer_duplex"
                id="receipt_printer_duplex"
              >
                <option value="">Off</option>
                <option value="long">Long edge</option>
                <option value="short">Short edge</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="input-row">
            <div class="frm-input-wrap">
              <input
                class="col form-control printer-name"

              <input

                <input

              <select

                <option value="">Off</option>
                <option value="long">Long edge</option>
                <option value="short">Short edge</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="input-row">
            <div class="frm-input-wrap">

              <input

              <select

        </div>

        <div class="form-group">
          <div class="input-row">
            <div class="frm-input-wrap">
              <input
                class="col form-control printer-name"
                type="text"
                name="full_sheet_printer_label"
                value="Full Sheet Printer"

              />
              <input
                class="col form-control page-size"
                type="number"
                step="0.01"
                placeholder="Width (In)"
                name="full_sheet_printer_width"
                id="full_sheet_printer_width"
              />
              <input

              <select class="col form-control" name="full_sheet_printer" id="full_sheet_printer">

              <div class="margin-wrap margin-col">

                <input

          <div class="input-row">
            <div class="frm-input-wrap">
              <input
                class="col form-control printer-name"
                type="text"

              <input

              <select class="col form-control" name="label_printer" id="label_printer">
                <option value="">Select</option>
              </select>
              <div class="margin-wrap margin-col">

        <div class="form-group justify-content-end save-btn-wrap">
          <span id="save-msg" class="hide">Printer Mapping Saved Successfully</span>
          <button type="submit" class="btn btn-primary" id="saveData">Save</button>
        </div>
      </form>
    </div>
    <script src="options.js"></script>
  </body>
</html>
