<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsTitle">Olorin Printer Settings</title>
    <link rel="stylesheet" type="text/css" href="css/options.css" />
  </head>
  <body>
    <div class="container">
      <div class="top-head">
        <h1 data-i18n="optionsHeading">Printer Settings</h1>
        <button class="btn btn-primary" id="refresh" data-i18n="optionsRefreshPrinters">
          Refresh Printers
        </button>
      </div>
      <div id="error-banner" class="error-banner hide" data-i18n="optionsErrorBanner">
        Companion App not reachable — make sure it is running, then click Refresh Printers.
      </div>
      <form id="printer" method="post">
        <div class="label-group">
          <div class="col printer-col" data-i18n="optionsColPrinter">Printer</div>
          <div class="col" data-i18n="optionsColPageWidth">Page Width</div>
          <div class="col" data-i18n="optionsColPageHeight">Page Height</div>
          <div class="col" data-i18n="optionsColPrinterOption">Printer Option</div>
          <div class="col margin-col">
            <div class="margin-wrap mwt">
              <div class="col full-width" data-i18n="optionsColMargin">Margin</div>
            </div>
            <div class="margin-wrap mwb">
              <div class="col" data-i18n="optionsColMarginTop">Top</div>
              <div class="col" data-i18n="optionsColMarginBottom">Bottom</div>
              <div class="col" data-i18n="optionsColMarginLeft">Left</div>
              <div class="col" data-i18n="optionsColMarginRight">Right</div>
            </div>
          </div>
          <div class="col" data-i18n="optionsColOrientation">Orientation</div>
          <div class="col" data-i18n="optionsColCopies">Copies</div>
          <div class="col" data-i18n="optionsColDuplex">Duplex</div>
        </div>

        <div class="form-group">
          <div class="input-row">
            <div class="frm-input-wrap">
              <input
                class="col form-control printer-name"
                type="text"
                name="receipt_printer_label"
                data-i18n="optionsPrinterReceipt"
                value="Receipt Printer"
                disabled
              />
              <input
                class="col form-control page-size"
                type="number"
                step="0.01"
                placeholder="Width (In)"
                data-i18n-placeholder="optionsWidthPlaceholder"
                name="receipt_printer_width"
                id="receipt_printer_width"
              />
              <input
                class="col form-control page-size"
                type="number"
                step="0.01"
                placeholder="Height (In)"
                data-i18n-placeholder="optionsHeightPlaceholder"
                name="receipt_printer_height"
                id="receipt_printer_height"
              />
              <select class="col form-control" name="receipt_printer" id="receipt_printer">
                <option value="" data-i18n="optionsSelect">Select</option>
              </select>
              <div class="margin-wrap margin-col">
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="receipt_printer_margin_top"
                  id="receipt_printer_margin_top"
                />
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="receipt_printer_margin_bottom"
                  id="receipt_printer_margin_bottom"
                />
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="receipt_printer_margin_left"
                  id="receipt_printer_margin_left"
                />
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="receipt_printer_margin_right"
                  id="receipt_printer_margin_right"
                />
              </div>
              <select
                class="col form-control"
                name="receipt_printer_orientation"
                id="receipt_printer_orientation"
              >
                <option value="" data-i18n="optionsSelect">Select</option>
                <option value="Portrait" data-i18n="optionsOrientationPortrait">Portrait</option>
                <option value="Landscape" data-i18n="optionsOrientationLandscape">Landscape</option>
                <option value="Automatic" data-i18n="optionsOrientationAutomatic">Automatic</option>
              </select>
              <input
                class="col form-control page-size"
                type="number"
                min="1"
                step="1"
                placeholder="1"
                data-i18n-placeholder="optionsCopiesPlaceholder"
                name="receipt_printer_copies"
                id="receipt_printer_copies"
              />
              <select
                class="col form-control"
                name="receipt_printer_duplex"
                id="receipt_printer_duplex"
              >
                <option value="" data-i18n="optionsDuplexOff">Off</option>
                <option value="long" data-i18n="optionsDuplexLong">Long edge</option>
                <option value="short" data-i18n="optionsDuplexShort">Short edge</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="input-row">
            <div class="frm-input-wrap">
              <input
                class="col form-control printer-name"
                type="text"
                name="sticker_printer_label"

              <input
                class="col form-control page-size"

                name="sticker_printer_width"
                id="sticker_printer_width"
              />
              <input
                class="col form-control page-size"

                step="0.01"
                placeholder="Height (In)"

                name="sticker_printer_height"

              <select class="col form-control" name="sticker_printer" id="sticker_printer">
                <option value="" data-i18n="optionsSelect">Select</option>
              </select>
              <div class="margin-wrap margin-col">
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="sticker_printer_margin_top"

                <input

                  placeholder="(In)"

                <input

                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="sticker_printer_margin_left"
                  id="sticker_printer_margin_left"
                />
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="sticker_printer_margin_right"
                  id="sticker_printer_margin_right"
                />
              </div>
              <select
                class="col form-control"
                name="sticker_printer_orientation"
                id="sticker_printer_orientation"
              >
                <option value="" data-i18n="optionsSelect">Select</option>
                <option value="Portrait" data-i18n="optionsOrientationPortrait">Portrait</option>
                <option value="Landscape" data-i18n="optionsOrientationLandscape">Landscape</option>
                <option value="Automatic" data-i18n="optionsOrientationAutomatic">Automatic</option>
              </select>
              <input
                class="col form-control page-size"
                type="number"
                min="1"
                step="1"
                placeholder="1"
                data-i18n-placeholder="optionsCopiesPlaceholder"
                name="sticker_printer_copies"
                id="sticker_printer_copies"
              />
              <select
                class="col form-control"
                name="sticker_printer_duplex"
                id="sticker_printer_duplex"
              >
                <option value="" data-i18n="optionsDuplexOff">Off</option>
                <option value="long" data-i18n="optionsDuplexLong">Long edge</option>
                <option value="short" data-i18n="optionsDuplexShort">Short edge</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="input-row">
            <div class="frm-input-wrap">
              <input
                class="col form-control printer-name"
                type="text"
                name="paper_printer_label"

              <input

                name="paper_printer_width"
                id="paper_printer_width"
              />
              <input

                type="number"
                step="0.01"
                placeholder="Height (In)"
                data-i18n-placeholder="optionsHeightPlaceholder"
                name="paper_printer_height"
                id="paper_printer_height"
              />
              <select class="col form-control" name="paper_printer" id="paper_printer">
                <option value="" data-i18n="optionsSelect">Select</option>
              </select>
              <div class="margin-wrap margin-col">
                <input

                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="paper_printer_margin_top"
                  id="paper_printer_margin_top"
                />
                <input

                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="paper_printer_margin_bottom"
                  id="paper_printer_margin_bottom"
                />
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="paper_printer_margin_left"
                  id="paper_printer_margin_left"
                />
                <input

              </div>
              <select

                name="paper_printer_orientation"
                id="paper_printer_orientation"
              >
                <option value="" data-i18n="optionsSelect">Select</option>
                <option value="Portrait" data-i18n="optionsOrientationPortrait">Portrait</option>
                <option value="Landscape" data-i18n="optionsOrientationLandscape">Landscape</option>
                <option value="Automatic" data-i18n="optionsOrientationAutomatic">Automatic</option>
              </select>
              <input

              <select

                <option value="short" data-i18n="optionsDuplexShort">Short edge</option>
              </select>
            </div>
          </div>
        </div>

          <div class="input-row">
            <div class="frm-input-wrap">

                type="text"

                data-i18n="optionsPrinterFullSheet"

              />
              <input
                class="col form-control page-size"
                type="number"
                step="0.01"
                placeholder="Width (In)"
                data-i18n-placeholder="optionsWidthPlaceholder"
                name="full_sheet_printer_width"
                id="full_sheet_printer_width"
              />
              <input
                class="col form-control page-size"
                type="number"
                step="0.01"
                placeholder="Height (In)"
                data-i18n-placeholder="optionsHeightPlaceholder"
                name="full_sheet_printer_height"
                id="full_sheet_printer_height"
              />
              <select class="col form-control" name="full_sheet_printer" id="full_sheet_printer">
                <option value="" data-i18n="optionsSelect">Select</option>
              </select>
              <div class="margin-wrap margin-col">
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="full_sheet_printer_margin_top"
                  id="full_sheet_printer_margin_top"
                />
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="full_sheet_printer_margin_bottom"
                  id="full_sheet_printer_margin_bottom"
                />
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="full_sheet_printer_margin_left"
                  id="full_sheet_printer_margin_left"
                />
                <input
                  class="col form-control page-size margin-field"
                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="full_sheet_printer_margin_right"
                  id="full_sheet_printer_margin_right"
                />
              </div>
              <select
                class="col form-control"
                name="full_sheet_printer_orientation"
                id="full_sheet_printer_orientation"
              >
                <option value="" data-i18n="optionsSelect">Select</option>
                <option value="Portrait" data-i18n="optionsOrientationPortrait">Portrait</option>
                <option value="Landscape" data-i18n="optionsOrientationLandscape">Landscape</option>

              </select>
              <input
                class="col form-control page-size"
                type="number"
                min="1"
                step="1"
                placeholder="1"
                data-i18n-placeholder="optionsCopiesPlaceholder"
                name="full_sheet_printer_copies"
                id="full_sheet_printer_copies"
              />
              <select
                class="col form-control"
                name="full_sheet_printer_duplex"

        <div class="form-group">
          <div class="input-row">
            <div class="frm-input-wrap">
              <input
                class="col form-control printer-name"
                type="text"
                name="label_printer_label"
                data-i18n="optionsPrinterLabel"
                value="Label Printer"
                disabled
              />
              <input
                class="col form-control page-size"
                type="number"
                step="0.01"
                placeholder="Width (In)"
                data-i18n-placeholder="optionsWidthPlaceholder"
                name="label_printer_width"
                id="label_printer_width"
              />
              <input
                class="col form-control page-size"
                type="number"
                step="0.01"
                placeholder="Height (In)"
                data-i18n-placeholder="optionsHeightPlaceholder"
                name="label_printer_height"
                id="label_printer_height"
              />
              <select class="col form-control" name="label_printer" id="label_printer">
                <option value="" data-i18n="optionsSelect">Select</option>
              </select>
              <div class="margin-wrap margin-col">

                <input

                <input

                  type="number"
                  step="0.01"
                  placeholder="(In)"
                  data-i18n-placeholder="optionsMarginPlaceholder"
                  name="label_printer_margin_right"
                  id="label_printer_margin_right"
                />
              </div>
              <select
                class="col form-control"
                name="label_printer_orientation"
                id="label_printer_orientation"
              >
                <option value="" data-i18n="optionsSelect">Select</option>
                <option value="Portrait" data-i18n="optionsOrientationPortrait">Portrait</option>
                <option value="Landscape" data-i18n="optionsOrientationLandscape">Landscape</option>
                <option value="Automatic" data-i18n="optionsOrientationAutomatic">Automatic</option>
              </select>
              <input
                class="col form-control page-size"
                type="number"

          <button type="submit" class="btn btn-primary" id="saveData" data-i18n="optionsSave">

    <script src="options.js"></script>

</html>
